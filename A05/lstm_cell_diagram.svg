<svg viewBox="0 0 1040 520" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a2e"/>
    </marker>
  </defs>

  <!-- outer cell box -->
  <rect x="140" y="30" width="800" height="420" rx="30" fill="#eaf6ee" stroke="#3f9d63" stroke-width="3"/>

  <!-- ============ CELL STATE LINE (top) ============ -->
  <line x1="40" y1="90" x2="140" y2="90" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="15" y="72" font-size="24" font-style="italic">C</text>
  <text x="32" y="80" font-size="15" font-style="italic">t-1</text>

  <line x1="140" y1="90" x2="244" y2="90" stroke="#1a1a2e" stroke-width="2.5"/>
  <circle cx="260" cy="90" r="17" fill="#fbe4e4" stroke="#c0392b" stroke-width="2"/>
  <text x="253" y="97" font-size="18">&#215;</text>

  <line x1="277" y1="90" x2="414" y2="90" stroke="#1a1a2e" stroke-width="2.5"/>
  <circle cx="430" cy="90" r="17" fill="#e4f0fb" stroke="#2c6fad" stroke-width="2"/>
  <text x="422" y="97" font-size="18">+</text>

  <line x1="447" y1="90" x2="640" y2="90" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="640" y1="90" x2="900" y2="90" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="900" y1="90" x2="1000" y2="90" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="965" y="72" font-size="24" font-style="italic">C</text>
  <text x="982" y="80" font-size="15" font-style="italic">t</text>

  <!-- branch down to tanh(cell) for the output path -->
  <line x1="640" y1="90" x2="640" y2="160" stroke="#1a1a2e" stroke-width="2.5"/>
  <rect x="600" y="160" width="80" height="40" rx="8" fill="#fdf3d6" stroke="#c9a227" stroke-width="2"/>
  <text x="618" y="186" font-size="16">tanh</text>
  <line x1="640" y1="200" x2="640" y2="220" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="640" y1="220" x2="740" y2="220" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="740" y1="220" x2="740" y2="243" stroke="#1a1a2e" stroke-width="2.5"/>

  <!-- output multiply -->
  <circle cx="740" cy="260" r="17" fill="#fbe4e4" stroke="#c0392b" stroke-width="2"/>
  <text x="733" y="267" font-size="18">&#215;</text>

  <!-- h_t exit path: drawn as two segments with a gap where it passes the cell-state line -->
  <line x1="740" y1="243" x2="740" y2="100" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="740" y1="80" x2="740" y2="20" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="720" y="14" font-size="24" font-style="italic">h</text>
  <text x="737" y="22" font-size="15" font-style="italic">t</text>

  <!-- ============ GATE BOXES ============ -->
  <!-- forget gate -->
  <line x1="260" y1="300" x2="260" y2="107" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="220" y="300" width="80" height="50" rx="8" fill="#fdf3d6" stroke="#c9a227" stroke-width="2"/>
  <text x="248" y="331" font-size="18">&#963;</text>
  <text x="248" y="368" font-size="14" font-style="italic">f</text>
  <text x="253" y="374" font-size="10" font-style="italic">t</text>

  <!-- input gate -->
  <line x1="380" y1="300" x2="380" y2="180" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="380" y1="180" x2="413" y2="180" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="340" y="300" width="80" height="50" rx="8" fill="#fdf3d6" stroke="#c9a227" stroke-width="2"/>
  <text x="368" y="331" font-size="18">&#963;</text>
  <text x="368" y="368" font-size="14" font-style="italic">i</text>
  <text x="373" y="374" font-size="10" font-style="italic">t</text>

  <!-- candidate -->
  <line x1="505" y1="300" x2="505" y2="180" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="505" y1="180" x2="447" y2="180" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="460" y="300" width="90" height="50" rx="8" fill="#e0f3ee" stroke="#1abc9c" stroke-width="2"/>
  <text x="480" y="331" font-size="16">tanh</text>
  <text x="486" y="368" font-size="14" font-style="italic">C&#771;</text>
  <text x="497" y="374" font-size="10" font-style="italic">t</text>

  <!-- combine i_t and C-tilde_t before the add node -->
  <circle cx="430" cy="180" r="15" fill="#fbe4e4" stroke="#c0392b" stroke-width="2"/>
  <text x="423" y="187" font-size="16">&#215;</text>
  <line x1="430" y1="163" x2="430" y2="107" stroke="#1a1a2e" stroke-width="2"/>

  <!-- output gate -->
  <line x1="740" y1="300" x2="740" y2="277" stroke="#1a1a2e" stroke-width="2"/>
  <rect x="700" y="300" width="80" height="50" rx="8" fill="#fdf3d6" stroke="#c9a227" stroke-width="2"/>
  <text x="728" y="331" font-size="18">&#963;</text>
  <text x="728" y="368" font-size="14" font-style="italic">o</text>
  <text x="733" y="374" font-size="10" font-style="italic">t</text>

  <!-- ============ INPUT BUS: h_t-1 and x_t ============ -->
  <line x1="40" y1="380" x2="140" y2="380" stroke="#1a1a2e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="380" x2="780" y2="380" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="8" y="362" font-size="24" font-style="italic">h</text>
  <text x="25" y="370" font-size="15" font-style="italic">t-1</text>

  <line x1="260" y1="380" x2="260" y2="353" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="380" y1="380" x2="380" y2="353" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="505" y1="380" x2="505" y2="353" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="740" y1="380" x2="740" y2="353" stroke="#1a1a2e" stroke-width="2"/>

  <line x1="180" y1="510" x2="180" y2="380" stroke="#1a1a2e" stroke-width="2.5"/>
  <text x="150" y="502" font-size="24" font-style="italic">x</text>
  <text x="167" y="510" font-size="15" font-style="italic">t</text>

</svg>
